name: Dependency Security Check

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  push:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  security-audit:
    runs-on: ubuntu-latest
    name: Security Audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Cache pnpm nếu có lockfile
      - name: Setup Node.js (with pnpm cache)
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      # Fallback nếu chưa có lockfile (tránh lỗi cache lock file)
      - name: Setup Node.js
        if: hashFiles('pnpm-lock.yaml') == ''
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Run pnpm audit
        id: audit
        run: |
          # Luôn tạo file JSON để các bước sau không fail
          pnpm audit --audit-level=moderate --json > audit-results.json || echo '{}' > audit-results.json
          echo "Audit results preview:"
          head -c 10000 audit-results.json || true

      - name: Parse audit results
        run: |
          # Hỗ trợ nhiều schema JSON khác nhau (pnpm / npm)
          TOTAL_VULNS=$(jq -r '
            if (.metadata and .metadata.vulnerabilities) then
              (.metadata.vulnerabilities.info
               + .metadata.vulnerabilities.low
               + .metadata.vulnerabilities.moderate
               + .metadata.vulnerabilities.high
               + .metadata.vulnerabilities.critical)
            elif (.vulnerabilities | type == "array") then
              (.vulnerabilities | length)
            else 0 end
          ' audit-results.json)

          HIGH_VULNS=$(jq -r '
            if (.metadata and .metadata.vulnerabilities and .metadata.vulnerabilities.high) then
              .metadata.vulnerabilities.high
            elif (.vulnerabilities | type == "array") then
              (.vulnerabilities | map(select(.severity == "high")) | length)
            else 0 end
          ' audit-results.json)

          CRITICAL_VULNS=$(jq -r '
            if (.metadata and .metadata.vulnerabilities and .metadata.vulnerabilities.critical) then
              .metadata.vulnerabilities.critical
            elif (.vulnerabilities | type == "array") then
              (.vulnerabilities | map(select(.severity == "critical")) | length)
            else 0 end
          ' audit-results.json)

          echo "TOTAL_VULNERABILITIES=${TOTAL_VULNS}" >> $GITHUB_ENV
          echo "HIGH_VULNERABILITIES=${HIGH_VULNS}" >> $GITHUB_ENV
          echo "CRITICAL_VULNERABILITIES=${CRITICAL_VULNS}" >> $GITHUB_ENV

      - name: Create security issue
        if: env.CRITICAL_VULNERABILITIES != '0' || env.HIGH_VULNERABILITIES != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const {
              TOTAL_VULNERABILITIES,
              HIGH_VULNERABILITIES,
              CRITICAL_VULNERABILITIES
            } = process.env;

            const body = `
            # 🚨 Security Vulnerabilities Detected

            **Summary:**
            - Total vulnerabilities: ${TOTAL_VULNERABILITIES}
            - Critical vulnerabilities: ${CRITICAL_VULNERABILITIES}
            - High vulnerabilities: ${HIGH_VULNERABILITIES}

            ## Action Required
            Please run the following commands to address these vulnerabilities:

            \`\`\`bash
            pnpm audit
            pnpm audit --fix        # If supported
            \`\`\`

            > Note: Some fixes may require dependency updates or manual patches.

            **Workflow:** ${{ github.workflow }}
            **Run ID:** ${{ github.run_id }}
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Security Alert: ${CRITICAL_VULNERABILITIES} Critical, ${HIGH_VULNERABILITIES} High Vulnerabilities`,
              body,
              labels: ['security', 'dependencies', 'urgent']
            });

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 30
