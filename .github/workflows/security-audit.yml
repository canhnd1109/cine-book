name: Dependency Security Check

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  push:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  security-audit:
    runs-on: ubuntu-latest
    name: Security Audit
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v5

      - name: 🧰 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: ⚙️ Setup Node.js (with pnpm cache if available)
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: 🧩 Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      - name: 🔍 Run pnpm audit
        id: audit
        run: |
          echo "Running audit..."
          pnpm audit --audit-level=moderate --json > audit-results.json || echo '{}' > audit-results.json
          echo "Preview audit results:"
          head -c 2000 audit-results.json || true

      - name: 📊 Parse audit results
        run: |
          # Parse tổng quan các mức độ
          TOTAL_VULNS=$(jq -r '
            if (.metadata and .metadata.vulnerabilities) then
              (.metadata.vulnerabilities.info
               + .metadata.vulnerabilities.low
               + .metadata.vulnerabilities.moderate
               + .metadata.vulnerabilities.high
               + .metadata.vulnerabilities.critical)
            elif (.vulnerabilities | type == "array") then
              (.vulnerabilities | length)
            else 0 end
          ' audit-results.json)

          LOW_VULNS=$(jq -r '
            if (.metadata and .metadata.vulnerabilities and .metadata.vulnerabilities.low) then
              .metadata.vulnerabilities.low
            elif (.vulnerabilities | type == "array") then
              (.vulnerabilities | map(select(.severity == "low")) | length)
            else 0 end
          ' audit-results.json)

          MODERATE_VULNS=$(jq -r '
            if (.metadata and .metadata.vulnerabilities and .metadata.vulnerabilities.moderate) then
              .metadata.vulnerabilities.moderate
            elif (.vulnerabilities | type == "array") then
              (.vulnerabilities | map(select(.severity == "moderate")) | length)
            else 0 end
          ' audit-results.json)

          HIGH_VULNS=$(jq -r '
            if (.metadata and .metadata.vulnerabilities and .metadata.vulnerabilities.high) then
              .metadata.vulnerabilities.high
            elif (.vulnerabilities | type == "array") then
              (.vulnerabilities | map(select(.severity == "high")) | length)
            else 0 end
          ' audit-results.json)

          CRITICAL_VULNS=$(jq -r '
            if (.metadata and .metadata.vulnerabilities and .metadata.vulnerabilities.critical) then
              .metadata.vulnerabilities.critical
            elif (.vulnerabilities | type == "array") then
              (.vulnerabilities | map(select(.severity == "critical")) | length)
            else 0 end
          ' audit-results.json)

          echo "TOTAL_VULNERABILITIES=${TOTAL_VULNS}" >> $GITHUB_ENV
          echo "LOW_VULNERABILITIES=${LOW_VULNS}" >> $GITHUB_ENV
          echo "MODERATE_VULNERABILITIES=${MODERATE_VULNS}" >> $GITHUB_ENV
          echo "HIGH_VULNERABILITIES=${HIGH_VULNS}" >> $GITHUB_ENV
          echo "CRITICAL_VULNERABILITIES=${CRITICAL_VULNS}" >> $GITHUB_ENV

      - name: 🧾 Generate Markdown Summary
        run: |
          TOTAL=${TOTAL_VULNERABILITIES:-0}
          LOW=${LOW_VULNERABILITIES:-0}
          MODERATE=${MODERATE_VULNERABILITIES:-0}
          HIGH=${HIGH_VULNERABILITIES:-0}
          CRITICAL=${CRITICAL_VULNERABILITIES:-0}

          # Đánh giá màu tổng quan
          if [ "$TOTAL" -eq 0 ]; then
            SCORE_ICON="🟢"
            STATUS="No vulnerabilities found"
          elif [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 5 ]; then
            SCORE_ICON="🔴"
            STATUS="Critical vulnerabilities detected"
          elif [ "$MODERATE" -gt 0 ]; then
            SCORE_ICON="🟡"
            STATUS="Moderate vulnerabilities found"
          else
            SCORE_ICON="🟢"
            STATUS="Minor issues only"
          fi

          echo "### 🛡️ Dependency Security Report $SCORE_ICON" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Severity | Count | Indicator |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Low | $LOW | 🟢 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Moderate | $MODERATE | 🟡 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 High | $HIGH | 🔴 |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚫ Critical | $CRITICAL | 🔴 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **$TOTAL** | **$SCORE_ICON** |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🧩 Run \`pnpm audit\` locally to see detailed report." >> $GITHUB_STEP_SUMMARY

      - name: 🚨 Create GitHub issue for vulnerabilities
        if: env.CRITICAL_VULNERABILITIES != '0' || env.HIGH_VULNERABILITIES != '0'
        uses: actions/github-script@v8
        with:
          script: |
            const {
              TOTAL_VULNERABILITIES,
              HIGH_VULNERABILITIES,
              CRITICAL_VULNERABILITIES
            } = process.env;

            const body = `
            # 🚨 Security Vulnerabilities Detected

            **Summary**
            | Severity | Count |
            |-----------|--------|
            | 🔴 Critical | ${CRITICAL_VULNERABILITIES} |
            | 🟡 High | ${HIGH_VULNERABILITIES} |
            | 🟢 Total | ${TOTAL_VULNERABILITIES} |

            ## ⚙️ Action Required
            Run:
            \`\`\`bash
            pnpm audit
            pnpm audit --fix
            \`\`\`

            **Workflow:** ${context.workflow}
            **Run ID:** ${context.runId}
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Security Alert: ${CRITICAL_VULNERABILITIES} Critical, ${HIGH_VULNERABILITIES} High`,
              body,
              labels: ['security', 'dependencies', 'urgent']
            });

      - name: 📤 Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 30
