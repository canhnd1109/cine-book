name: 🚀 Performance Monitoring

on:
  schedule:
    - cron: '0 2 * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    name: 🌐 Lighthouse Audit
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v5

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: 🪄 Setup Node.js (with cache)
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: 🏗️ Build Nuxt app
        run: pnpm build

      - name: 🚀 Start preview server
        env:
          NITRO_PRESET: node
        run: |
          set -e
          (pnpm preview --port 3000 > preview.log 2>&1 &) || true
          sleep 6
          if ! nc -z localhost 3000; then
            (node .output/server/index.mjs > preview.log 2>&1 &) || true
          fi
          sleep 6
          echo "✅ Server started (port 3000). Tail logs:"
          tail -n 20 preview.log || true

      - name: 🕓 Wait until server ready
        run: |
          timeout 60s bash -c 'until curl -fsS http://localhost:3000 > /dev/null; do sleep 3; done'
          echo "✅ Server is live!"

      - name: 🧭 Setup Chrome for Lighthouse
        uses: browser-actions/setup-chrome@v2

      - name: 📊 Run Lighthouse audits
        run: |
          set -euo pipefail
          mkdir -p lighthouse-reports

          pnpm dlx lighthouse http://localhost:3000 \
            --output=json \
            --output-path=lighthouse-reports/home.json \
            --chrome-path="$CHROME_PATH" \
            --chrome-flags="--headless --no-sandbox" || true

          if curl -fsS http://localhost:3000/components > /dev/null; then
            pnpm dlx lighthouse http://localhost:3000/components \
              --output=json \
              --output-path=lighthouse-reports/components.json \
              --chrome-path="$CHROME_PATH" \
              --chrome-flags="--headless --no-sandbox" || true
          fi

      - name: 📈 Extract metrics
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y jq

          parse_scores() {
            local file=$1 prefix=$2
            if [ -f "$file" ]; then
              echo "$prefix_PERF=$(jq -r '(.categories.performance.score // 0)*100' "$file")" >> $GITHUB_ENV
              echo "$prefix_ACC=$(jq -r '(.categories.accessibility.score // 0)*100' "$file")" >> $GITHUB_ENV
              echo "$prefix_BP=$(jq -r '(.categories["best-practices"].score // 0)*100' "$file")" >> $GITHUB_ENV
              echo "$prefix_SEO=$(jq -r '(.categories.seo.score // 0)*100' "$file")" >> $GITHUB_ENV
            fi
          }

          parse_scores lighthouse-reports/home.json HOME
          parse_scores lighthouse-reports/components.json COMPONENTS || true

      - name: 🧾 Generate summary report
        run: |
          colorize() {
            local score=$1
            if [ "$score" -ge 90 ]; then
              echo "🟢 $score"
            elif [ "$score" -ge 80 ]; then
              echo "🟡 $score"
            elif [ "$score" -gt 0 ]; then
              echo "🔴 $score"
            else
              echo "N/A"
            fi
          }

          echo "## 🌐 Lighthouse Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Page | ⚡ Performance | ♿ Accessibility | 🧠 Best Practices | 🔍 SEO |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------------:|----------------:|------------------:|--------:|" >> $GITHUB_STEP_SUMMARY

          echo "| Home | $(colorize "${HOME_PERF:-0}") | $(colorize "${HOME_ACC:-0}") | $(colorize "${HOME_BP:-0}") | $(colorize "${HOME_SEO:-0}") |" >> $GITHUB_STEP_SUMMARY
          echo "| Components | $(colorize "${COMPONENTS_PERF:-0}") | $(colorize "${COMPONENTS_ACC:-0}") | $(colorize "${COMPONENTS_BP:-0}") | $(colorize "${COMPONENTS_SEO:-0}") |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🟢 Excellent (≥90) 🟡 Good (80–89) 🔴 Needs Improvement (<80)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Generated on $(date) by **${{ github.workflow }}**_" >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const summary = fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: 📦 Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14

  bundle-analysis:
    runs-on: ubuntu-latest
    name: 📦 Bundle Size Report
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm build

      - name: 📊 Analyze bundle sizes
        shell: bash
        run: |
          set -euo pipefail
          echo "## 📦 Bundle Size Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Directory | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|------:|" >> $GITHUB_STEP_SUMMARY

          for dir in ".output" ".output/public"; do
            if [ -d "$dir" ]; then
              size=$(du -sh "$dir" | cut -f1)
              echo "| $dir | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔝 Top 20 Largest JS Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find .output/public -type f -name "*.js" -printf '%s %p\n' 2>/dev/null \
            | sort -nr | head -20 \
            | awk '{printf "| %s | %.2f KB |\n", $2, $1/1024}' >> $GITHUB_STEP_SUMMARY || true

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Generated on $(date) by **${{ github.workflow }}**_" >> $GITHUB_STEP_SUMMARY
