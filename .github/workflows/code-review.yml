name: Automated Code Review 🧠

on:
  pull_request:
    branches: [develop, production]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # =====================================
  # 🧩 1️⃣ CODE COMPLEXITY REVIEW (Madge)
  # =====================================
  code-review:
    runs-on: ubuntu-latest
    name: 🧩 Code Complexity Review
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - name: Run Madge complexity analysis
        shell: bash
        run: |
          echo "## 🧩 Code Complexity Analysis" >> $GITHUB_STEP_SUMMARY
          DIRS=()
          for d in app components composables plugins utils lib; do
            [ -d "$d" ] && DIRS+=("$d")
          done
          if [ ${#DIRS[@]} -gt 0 ]; then
            echo "**Analyzed directories:** ${DIRS[*]}" >> $GITHUB_STEP_SUMMARY
            {
              npx madge --circular --extensions ts,tsx,js,jsx "${DIRS[@]}" || true
              npx madge --summary "${DIRS[@]}" || true
            } > temp_madge.txt
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat temp_madge.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_No JS/TS directories found for Madge._" >> $GITHUB_STEP_SUMMARY
          fi

  # =====================================
  # 🧹 2️⃣ CODE QUALITY CHECKS
  # =====================================
  code-quality-checks:
    runs-on: ubuntu-latest
    name: 🧹 Code Quality Checks
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - name: 🔍 TODO / FIXME comments
        shell: bash
        run: |
          echo "## 🔍 TODO & FIXME" >> $GITHUB_STEP_SUMMARY
          FOUND=$(grep -R -n -E "TODO|FIXME" --include="*.{ts,tsx,js,jsx,vue}" app components pages layouts composables plugins server utils lib 2>/dev/null || true)
          if [ -z "$FOUND" ]; then
            echo "✅ No TODO/FIXME comments found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Found TODO/FIXME lines (top 20):" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$FOUND" | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🧾 Console.* statements
        shell: bash
        run: |
          echo "## 🧾 Console Statements" >> $GITHUB_STEP_SUMMARY
          FOUND=$(grep -R -n -E "console\." --include="*.{ts,tsx,js,jsx,vue}" app components pages layouts composables plugins server utils lib 2>/dev/null || true)
          if [ -z "$FOUND" ]; then
            echo "✅ No console statements found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Found console logs (top 20):" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$FOUND" | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📦 Unused exports/imports (Knip)
        run: npx knip --reporter summary || true

      - name: 🧱 Component file list
        shell: bash
        run: |
          echo "## 🧱 Component Files (.vue)" >> $GITHUB_STEP_SUMMARY
          if [ -d components ]; then
            find components -maxdepth 2 -type f -name "*.vue" | sort > temp_components.txt
            echo '| Component | Path |' >> $GITHUB_STEP_SUMMARY
            echo '|------------|------|' >> $GITHUB_STEP_SUMMARY
            while read file; do
              name=$(basename "$file")
              echo "| $name | $file |" >> $GITHUB_STEP_SUMMARY
            done < temp_components.txt
          else
            echo "_No components directory found._" >> $GITHUB_STEP_SUMMARY
          fi

  # =====================================
  # ⚡ 3️⃣ PERFORMANCE ANALYSIS
  # =====================================
  performance-check:
    runs-on: ubuntu-latest
    name: ⚡ Performance Analysis
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install

      - name: 🏗️ Build project
        run: pnpm build

      - name: 📊 Analyze build output sizes
        shell: bash
        run: |
          echo "## 📊 Build Output Sizes" >> $GITHUB_STEP_SUMMARY
          if [ -d ".output/public" ]; then
            du -sh .output .output/public >> $GITHUB_STEP_SUMMARY
            find .output/public -type f -name "*.js" | head -20 > temp_js.txt
            echo "### 📦 JS Assets (sample):" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat temp_js.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          elif [ -d "dist" ]; then
            du -sh dist >> $GITHUB_STEP_SUMMARY
            find dist -type f -name "*.js" | head -20 > temp_js.txt
            echo "### 📦 JS Assets (sample):" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat temp_js.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_No Nuxt output directory (.output/ or dist/) found._" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🖼️ Image optimization candidates
        shell: bash
        run: |
          echo "## 🖼️ Image Optimization Candidates" >> $GITHUB_STEP_SUMMARY
          if [ -d public ] || [ -d assets ]; then
            find public assets -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.gif" -o -iname "*.webp" \) \
              2>/dev/null | head -20 > temp_imgs.txt
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat temp_imgs.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_No image directories (public/ or assets/) found._" >> $GITHUB_STEP_SUMMARY
          fi

  # =====================================
  # 🔒 4️⃣ SECURITY ANALYSIS
  # =====================================
  security-analysis:
    runs-on: ubuntu-latest
    name: 🔒 Security Analysis
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install

      - name: 🔑 Check for hardcoded secrets
        shell: bash
        run: |
          echo "## 🔑 Security Scan" >> $GITHUB_STEP_SUMMARY
          FOUND=$(grep -R -n -i -E "password|secret|api[_-]?key|token|bearer\s+[A-Za-z0-9\._\-]+" \
            --include="*.{ts,tsx,js,jsx,vue}" app components pages layouts composables plugins server utils lib 2>/dev/null | grep -v "placeholder" || true)
          if [ -z "$FOUND" ]; then
            echo "✅ No hardcoded secrets found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Found potential secrets (top 20):" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$FOUND" | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🧩 pnpm audit (best-effort)
        run: pnpm audit --audit-level=moderate || true

  # =====================================
  # ♿ 5️⃣ ACCESSIBILITY CHECK
  # =====================================
  accessibility-check:
    runs-on: ubuntu-latest
    name: ♿ Accessibility Check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install

      - name: 🧠 Accessibility pattern scan
        shell: bash
        run: |
          echo "## ♿ Accessibility Scan" >> $GITHUB_STEP_SUMMARY
          echo "Scanning for missing **alt** and **label** attributes..." >> $GITHUB_STEP_SUMMARY

          MISSING_ALT=$(grep -R -n -E "<img|<NuxtImg" --include="*.{vue,ts,tsx,js,jsx}" app components pages layouts 2>/dev/null | grep -v "alt=" || true)
          if [ -z "$MISSING_ALT" ]; then
            echo "✅ All images likely have alt attributes" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Missing alt attributes (top 10):" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$MISSING_ALT" | head -10 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          MISSING_LABEL=$(grep -R -n -E "<input|<select|<textarea" --include="*.{vue,ts,tsx,js,jsx}" app components pages layouts 2>/dev/null | grep -v -E "label|aria-label" || true)
          if [ -z "$MISSING_LABEL" ]; then
            echo "✅ All inputs likely have labels" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Missing labels (top 5):" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$MISSING_LABEL" | head -5 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
