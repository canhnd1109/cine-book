version: 2
updates:
  # Update dependencies npm với nhóm production và dev
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 10
    reviewers:
      - 'canhnd1109'
    assignees:
      - 'canhnd1109'
    target-branch: 'develop'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
      include: 'scope'
    groups:
      production-dependencies:
        patterns:
          - 'vue*'
          - 'nuxt*'
          - '@types/*'
          - 'typescript'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - '@tailwindcss/*'
          - 'tailwindcss'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    labels:
      - 'dependencies'
      - 'auto-update'

  # Update GitHub Actions workflow
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Ho_Chi_Minh'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'github-actions'
      - 'auto-update'
